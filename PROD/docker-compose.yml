version: '3.8'

services:
  vendedores:
    build:
      context: ..
      dockerfile: ./PROD/Dockerfile
    container_name: vendedores
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.vendedores.rule=Host(`vendedores.fullengineer.com.br`)"
      - "traefik.http.routers.vendedores.entrypoints=websecure"
      - "traefik.http.routers.vendedores.tls.certresolver=letsencrypt"
      - "traefik.http.services.vendedores.loadbalancer.server.port=80"
      - "traefik.http.routers.vendedores.middlewares=vendedores-stripprefix@docker"
      - "traefik.http.middlewares.vendedores-stripprefix.stripprefix.prefixes=/vendedores"
      - "traefik.http.middlewares.vendedores-stripprefix.stripprefix.forceSlash=false"

networks:
  traefik-network:
    external: true
    name: traefik-network